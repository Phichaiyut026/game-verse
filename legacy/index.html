<!doctype html>
<html lang="th">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

      <div>

      </div>
      <div>

      <div>

      <div>
        <h4>ช่วยเหลือ</h4>
        <a href="#/help">คำถามที่พบบ่อย</a><a href="#/help">ติดต่อเรา</a>
      </div>
    </div>
    <p class="container muted small">© 2026 GameVerse — เว็บไซต์เดโม ไม่มีการชำระเงินจริง</p>
  </footer>

  <div id="modal" class="modal hidden"></div>
  <div id="toasts" class="toasts"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
